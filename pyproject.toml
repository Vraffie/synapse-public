[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-agent-control"
version = "0.1.0"
description = "Local-first multi-agent orchestration platform"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "websockets>=13,<18"]

[project.scripts]
agentd = "synapse.daemon.__main__:main"
agentd-supervisor = "synapse.supervisor.__main__:main"
agentctl = "synapse.cli.__main__:main"
agent-desktop = "synapse.desktop.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27,<1", "mcp>=1.20,<2", "jsonschema>=4.23,<5"]
desktop = ["PySide6>=6.7,<7"]
mcp = ["mcp>=1.20,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"synapse.persistence" = ["migrations_sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
